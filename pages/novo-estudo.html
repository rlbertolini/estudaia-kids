<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo Estudo</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
<h1>➕ Novo Estudo</h1>
<p>Crie um estudo para iniciar.</p>
</header>

<main>

<section class="card">

<label>Nome do estudo</label>

<input
id="nomeEstudo"
type="text"
placeholder="Ex.: Ciências - Capítulo 4">

<br><br>

<label>Vídeo</label>

<input
id="video"
type="file"
accept="video/*">

<p id="nomeVideo">Nenhum vídeo selecionado.</p>

<br>

<button id="criar">
Criar Estudo
</button>

</section>

</main>

<script src="../js/novo-estudo.js"></script>

</body>

</html>
