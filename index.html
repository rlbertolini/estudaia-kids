<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EstudaIA Kids</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            font-size: 56px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            color: #24324a;
        }

        .subtitle {
            font-size: 18px;
            color: #68758a;
            margin: 12px 0 35px;
        }

        .start-button {
            border: none;
            border-radius: 16px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #4f7cff;
            color: white;
        }

        .start-button:hover {
            opacity: 0.9;
        }

        .status {
            margin-top: 25px;
            color: #68758a;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <main class="app">

        <div class="logo">📚</div>

        <h1>EstudaIA Kids</h1>

        <p class="subtitle">
            Um jeito divertido de aprender!
        </p>

        <button class="start-button" onclick="iniciarEstudos()">
            🚀 Começar
        </button>

        <div class="status" id="status"></div>

    </main>

    <script>
        function iniciarEstudos() {
            document.getElementById("status").textContent =
                "🎉 Muito bem! Nosso aplicativo está funcionando!";
        }
    </script>

</body>
</html>
