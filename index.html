<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudaIA Kids</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎓 EstudaIA Kids</h1>
  <p>Seu professor virtual particular</p>
</header>

<main>

<section class="card">
<h2>📹 Estudar por Vídeo</h2>
<p>Envie um vídeo para iniciar um estudo personalizado.</p>
<button>Começar</button>
</section>

<section class="card">
<h2>📝 Simulados</h2>
<p>Pratique com questões inteligentes.</p>
<button>Abrir</button>
</section>

<section class="card">
<h2>🧠 Flashcards</h2>
<p>Revise rapidamente.</p>
<button>Estudar</button>
</section>

<section class="card">
<h2>📊 Meu Progresso</h2>
<p>Acompanhe sua evolução.</p>
<button>Ver</button>
</section>

</main>

<footer>
<p>Versão 1.0 • Desenvolvido com ❤️</p>
</footer>

<script src="app.js"></script>

</body>
</html>
